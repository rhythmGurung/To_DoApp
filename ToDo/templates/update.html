  
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6fb;
        }

        .main-card {
            max-width: 650px;
            margin: auto;
            border: none;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card main-card shadow-sm p-4">

        <h2 class="text-center text-primary fw-bold mb-4">
            Update Task
        </h2>

        <!-- Update Task Form -->
        <form method="POST">

            {% csrf_token %}

            <!-- Task Title -->
            <div class="mb-3">
                <label class="form-label">Task Title</label>

                <input type="text"
                       name="title"
                       class="form-control"
                       value="{{ todo.title }}"
                       placeholder="Enter task title"
                       required>
            </div>

            <!-- Task Description -->
            <div class="mb-3">
                <label class="form-label">Description</label>

                <textarea name="description"
                          class="form-control"
                          rows="3"
                          placeholder="Task details...">{{ todo.description }}</textarea>
            </div>

            <!-- Completion Status -->
            <div class="form-check mb-4">

                <input type="checkbox"
                       name="completed"
                       class="form-check-input"
                       id="completed"
                       {% if todo.completed %}checked{% endif %}>

                <label for="completed" class="form-check-label">
                    Mark as completed
                </label>

            </div>

            <!-- Buttons -->
            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary w-100">
                    Update Task
                </button>

                <a href="{% url 'home' %}"
                   class="btn btn-outline-secondary w-100">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
